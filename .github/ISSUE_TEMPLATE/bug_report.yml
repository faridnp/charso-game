name: Bug report
description: Report a reproducible defect in Charso.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Bug summary
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: List the smallest reliable steps to reproduce.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Device model / Android version
    validations:
      required: false
  - type: input
    id: build
    attributes:
      label: App version or commit
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots, or recording
      description: Remove personal data, tokens, receipts, and other secrets before sharing.
    validations:
      required: false
