name: Feature request
description: Propose a player-facing improvement or new capability.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Player problem
      description: What player need or problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Describe observable, testable outcomes.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Security, performance, localization, and heritage impact
    validations:
      required: false
