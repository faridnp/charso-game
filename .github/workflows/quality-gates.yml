name: Repository quality gates

on:
  push:
    branches: [main, "docs/**", "feature/**", "fix/**", "test/**", "production/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation-checks:
    name: Foundation and documentation checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate repository foundation
        run: python3 scripts/validate_repo.py

      - name: Validate puzzle bank and coin economy
        run: python3 scripts/validate_puzzles.py
