name: Charso Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: charso-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  project-check:
    name: Check Unity project and cloud license configuration
    runs-on: ubuntu-latest
    outputs:
      project_ready: ${{ steps.check.outputs.project_ready }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify Unity project structure
        id: check
        shell: bash
        run: |
          if [[ -f "ProjectSettings/ProjectVersion.txt" && -d "Assets" && -d "Packages" ]]; then
            echo "project_ready=true" >> "$GITHUB_OUTPUT"
            echo "Unity project structure found."
          else
            echo "project_ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "## APK build not started"
              echo "The repository does not contain a complete Unity project yet."
              echo "Expected: ProjectSettings/ProjectVersion.txt, Assets/, and Packages/."
              echo "This is intentional while the project is still in pre-production."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  build-android-apk:
    name: Build Android APK (GitHub-hosted runner)
    needs: project-check
    if: needs.project-check.outputs.project_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true

      - name: Require Unity license secret
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        shell: bash
        run: |
          if [[ -z "$UNITY_LICENSE" ]]; then
            echo "::error::UNITY_LICENSE is not configured. Cloud Unity licensing must be completed before an APK can be built."
            echo "See docs/BUILD_PIPELINE.md. Do not commit license files or credentials."
            exit 1
          fi

      - name: Cache Unity Library
        uses: actions/cache@0c45773b623bea8c8e75f6c82b208c3cf94ea4f # v4.2.1
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-Android-

      - name: Build APK with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: Android
          buildName: Charso
          buildPath: build

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Charso-Android-APK
          path: build/**/*.apk
          if-no-files-found: warn
          retention-days: 14
